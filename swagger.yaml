      operationId: opportunityJoin
      summary: Join an extracurricular opportunity
      description: |
        Records the opportunity as joined for the authenticated student's simulation.
        A simulation may have no more than 3 joined opportunities at one time.
        Joining records membership only; benefits are applied later through activities, readiness calculations, or recommendations.
      tags:
        - "Iteration 2 (Designed)"
      parameters:
        - $ref: '#/x-components/path/SimulationId'
        - $ref: '#/x-components/path/OpportunityId'
        - $ref: '#/x-components/header/Session'
      responses:
        200:
          description: Opportunity joined successfully
          schema:
            $ref: '#/x-components/return/OpportunityMembership'
        400:
          description: |
            If any of the following are true:
            - **INVALID_OPPORTUNITY**
              - Opportunity ID does not exist in the simulation's universe
            - **ALREADY_JOINED**
              - The opportunity has already been joined
            - **OPPORTUNITY_LIMIT_REACHED**
              - The simulation already has 3 joined opportunities
            - **SIMULATION_ENDED**
              - The simulation has graduated or dropped out
          schema:
            $ref: '#/x-components/return/Error'
        401:
          description: |
            - **UNAUTHORISED**
